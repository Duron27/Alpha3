default:
  tags:
    - selfhosted-1

# Set to "selfhosted-1" for no-billing 12C/20GB or use "saas-linux-medium-amd64"

variables:

  ANDROID_COMPILE_SDK: "36"

  ANDROID_BUILD_TOOLS: "35.0.0"

stages:
  - building
  - tests
  - release

# Run the build script and create an apk using gradle
buildingJob:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never
# Run CI when a new tag is created
  interruptible: true
  stage: building
  
  image: fedora:44

  before_script:
  - echo $CI_COMMIT_TAG
  - dnf upgrade -y
  - dnf install -y @development-tools
  - dnf install -y wget glibc-devel.i686 glibc-devel gcc gcc-c++ libstdc++-devel unzip zip bzip2 cmake make which pkgconf pkg-config 
  # The native build clones and patches OpenMW and Mesa (Turnip/Zink) and needs these for it and for the Mesa and ANGLE builds:
  - dnf install -y git patch diffutils python3 python3-pip python3-mako python3-pyyaml python3-packaging meson ninja-build bison flex glslang
  # Only needed until JDK 21 isn't used anymore:
  - dnf install -y adoptium-temurin-java-repository && fedora-third-party enable && dnf install -y temurin-21-jdk

  # Set path for ANDROID_home and create directory:
  - export ANDROID_HOME="${PWD}/android-sdk-root"
  - mkdir $ANDROID_HOME

  # Download, unzip, move and add to path the latest android sdk cli tools:
  - wget --no-verbose --output-document=$ANDROID_HOME/cmdline-tools.zip $(curl https://developer.android.com/studio | grep -o "https://dl.google.com/android/repository/commandlinetools-linux-[0-9]*_latest.zip")
  - unzip -q -d "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools.zip"
  - mv -T "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tools"
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin

  #Accept all sdk licenses preemptively:
  - yes | sdkmanager --licenses > /dev/null || true

  # Install Android Tooling
  - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}"
  - sdkmanager "ndk;29.0.14206865"
  - sdkmanager "platform-tools"
  - sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"

  # Release signing: alpha3-keystore.jks and release-keystore.properties are in Settings > CI/CD > Secure files. They download
  # to .secure_files/ under their own names. storeFile in the properties is relative to the properties file, so they have to
  # sit side by side in the repo root (androidApp/build.gradle.kts looks there).
  - curl --silent --show-error --fail "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
  - test -f .secure_files/alpha3-keystore.jks && test -f .secure_files/release-keystore.properties || { echo "Secure files alpha3-keystore.jks / release-keystore.properties not downloaded:"; ls -la .secure_files; exit 1; }
  - cp .secure_files/alpha3-keystore.jks .secure_files/release-keystore.properties .

  # Not necessary, just in case someone changed the flag:
  - chmod +x ./gradlew

  script:
    # assembleRelease also runs generateNativeSymbolsRelease (androidApp/build.gradle.kts), which writes the debug symbols of every
    # native library named by build id, the same id the crash reports print:
    #   androidApp/src/main/assets/symbols/<build id>.syms        function names (the app bundles these for its crash viewer)
    #   androidApp/native-symbols/.build-id/ab/cdef....debug      full debug info (source lines), for llvm-addr2line / lldb
    # tee shows the output in the job log and writes gradle.log; pipefail keeps gradle's exit code instead of tee's
    - set -o pipefail; ./gradlew assembleRelease -Dorg.gradle.java.home=/usr/lib/jvm/temurin-21-jdk/ 2>&1 | tee ./gradle.log
    - cp androidApp/build/outputs/apk/release/*.apk openmw-android-alpha3-$CI_COMMIT_TAG.apk
    # Keep the symbols next to the apk: without them a crash report from this release cannot be read down to source lines.
    - test "$(find androidApp/native-symbols/.build-id -name '*.debug' | wc -l)" -gt 0 || { echo "No debug symbols were produced"; exit 1; }
    - test "$(ls androidApp/src/main/assets/symbols/*.syms | wc -l)" -gt 0 || { echo "No symbol tables were produced"; exit 1; }
    # One symbol table per build id in the package registry, which is where the app's crash viewer looks for builds it does not
    # carry itself (composeApp crash/OnlineSymbols.android.kt). Uploaded with the job token; PUT is idempotent.
    - |
      for table in androidApp/src/main/assets/symbols/*.syms; do
        id=$(basename "$table" .syms)
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$table" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/native-symbols/$id/$id.syms"
      done
    - (cd androidApp && zip -qr ../openmw-android-alpha3-$CI_COMMIT_TAG-symbols.zip native-symbols src/main/assets/symbols)

  # So we can access the artifacts in the next job:
  after_script:
    - echo "JOB_ID=$CI_JOB_ID" >> job.env
    

  artifacts:
    when: always
    paths:
      - ./buildscript.log
      - ./gradle.log
      - openmw-android-alpha3-$CI_COMMIT_TAG.apk
      - openmw-android-alpha3-$CI_COMMIT_TAG-symbols.zip
    expire_in: never
    reports:
      dotenv: job.env


# Create a release with the apk attached, named after the tag which triggered the CI:
releaseJob:
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: buildingJob
      artifacts: true
  script:
    - echo "Create Release $CI_COMMIT_TAG"
    - echo $JOB_ID  
  release:
    name: 'Release $CI_COMMIT_TAG'
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: "openmw-android-alpha3-$CI_COMMIT_TAG.apk"
          url: "https://gitlab.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/-/jobs/$JOB_ID/artifacts/file/openmw-android-alpha3-$CI_COMMIT_TAG.apk"
        - name: "openmw-android-alpha3-$CI_COMMIT_TAG-symbols.zip (debug symbols for crash reports)"
          url: "https://gitlab.com/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/-/jobs/$JOB_ID/artifacts/file/openmw-android-alpha3-$CI_COMMIT_TAG-symbols.zip"
