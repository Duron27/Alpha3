# Alpha3's settings: what we change in OpenMW's own defaults (its files/settings-default.cfg), on Android and iOS.
# At build time cpp/settings/merge.cmake writes the engine's defaults with these on top: the template for the user's
# settings.cfg (settings.fallback.cfg in the APK, settings.cfg in the iOS bundle). Edit this, not a copy.
#
# A setting here replaces the default's value (and its comment, when it has one here); one OpenMW does not have is
# added to its section. Only list what differs from the defaults.

[Video]

# Maximum rendering framerate.
framerate limit = 60

# Height recommended for your device
resolution y = 0

# Width recommended for your device
resolution x = 0

# 0 = Fullscreen, 1 = Windowed Fullscreen, 2 = Windowed
window mode = 0

# opengl es 3.2 = the phone's own GLES 3.2 driver, opengl = desktop OpenGL through Mesa Zink on Vulkan
renderer = opengl es 3.2

[Terrain]

# If true, use paging and LOD algorithms to display the entire terrain. If false, only display terrain of the loaded cells.
distant terrain = true

# Alpha3: past the active grid, draw the meshes named below as flat cards (three crossed quads showing the mesh from six
# sides) instead of their 3D models. The active cells keep the real meshes. A card is made the first time it is needed
# and kept in the cache directory (impostors/). Needs distant terrain.
impostors = true

# Parts of mesh file names (comma separated, any case) that are drawn as cards. A mesh with its own _dist version keeps it.
impostor meshes = flora_tree,flora_bc_tree,flora_ashtree,flora_emp_parasol

# Texels per side of each of the six views of a card (16 to 512).
impostor size = 64

# Alpha3: past the active grid, draw the meshes named below simplified (fewer triangles, the same textures), the rocks,
# buildings and the rest. Meshes made into cards above are not simplified. Animated meshes, particles and meshes that do
# not get at least a fifth smaller keep their own. Made the first time each is needed, kept in the cache directory.
distant mesh simplification = true

# Parts of mesh file names (comma separated, any case; * is every mesh) that are simplified.
simplified meshes = *

# How far a simplified surface may move from the original, as a part of the mesh's size (0.02 = 2%).
simplified mesh error = 0.02

# Meshes with fewer triangles than this are left as they are.
simplified mesh min triangles = 200

# Versions of each simplified mesh, each with twice the error of the one before. Paging uses the first for chunks of
# one cell, the second for chunks of 2 cells, the third for 4 and more (farther away). A version that is not at least
# a fifth smaller than the one before is not made.
simplified mesh levels = 3

[Camera]

# Reverse the depth range, reduces z-fighting of distant objects and terrain
reverse z = false

# Occlusion culling (support library): objects hidden behind terrain and large opaque meshes (buildings, rocks) are
# not drawn. The large meshes of the last frame are drawn on the CPU into a small depth buffer, and what is behind them
# everywhere is culled. Helps most in towns (Vivec, Balmora). Where it culls next to nothing (fewer than 1 in 50 of
# what it tests, as on open ground or with object paging's merged chunks) it rests by itself, trying again after half a
# second, then after longer rests up to 8 seconds, so it costs little where it does not help. Where it culls, it
# checks every half minute or so that frames are really faster with it (a few seconds of frames in turn without and
# with it), and rests for a while where they are not.
occlusion culling = true

# Width in pixels of the depth buffer (its height is half of it). Smaller is faster to draw, and coarser. Measured in
# Vivec on a Snapdragon 855 (gear menu > Benchmark): 2048 took 19 ms a frame to draw and made the frame CPU-bound
# (42 ms, against 29 ms without culling); 1024 5.4 ms, 512 2.3 ms, 256 1.3 ms (25 ms a frame), each culling the same
# 35% of what it tested.
occlusion buffer width = 256

# Bounding radius, in world units, a mesh needs to hide other objects (terrain chunks, buildings, large rocks).
occluder min size = 300

# Occluder triangles drawn per frame, nearest and largest first. 20000 take about 1 ms on a desktop CPU; phones are
# slower.
occluder triangle budget = 80000

# Cut large static shapes (Vivec's cantons, object paging's merged active grid chunks) into pieces on a grid when they
# load, so occlusion culling can hide the parts behind a wall instead of drawing the whole shape. More draw calls; off
# draws the meshes as they are. Needs occlusion culling.
occlusion mesh splitting = false
# Side of a piece, in game units (a cell is 8192), and the most pieces one shape is cut into (the grid grows to fit)
occlusion split size = 2048
occlusion split max pieces = 16

# Leave out point lights whose whole sphere of influence is hidden behind the occluders (lights in the room behind a
# wall): each object's light list, and its shader's light loop, gets shorter. Off lights as before. Needs occlusion
# culling.
occlusion light culling = false

[Shadows]

# Point lights (torches, candles, lanterns, ...) that cast shadows: the ones closest to the camera, up to this many,
# 0 to 4. Each draws the objects, statics and actors around it six times a frame (a cube of shadow maps), so every one
# costs frame time. 0 = off. Needs OpenGL ES and lighting method other than clustered.
point light shadows = 2

# Size of each of a light's six shadow maps, 64 to 1024
point light shadow resolution = 256

# How many of the lights' shadow map faces are drawn again each frame, 1 to 24 (2 lights have 12). Each draws the scene
# around its light once more, which on a phone costs a few milliseconds; the others keep what they drew last. Lights
# that stay put need little: what moves near them (actors) is updated a few times a second.
point light shadow faces per frame = 2

# Whether the object a light belongs to shadows it too: a lantern's frame, the actor holding a torch. Off, they are
# left out of their own light's shadow maps.
point light shadow from own object = true

# Lights farther from the camera than this (in game units) cast no shadows; they fade out over the last fifth
point light shadow distance = 2048

# Near plane of the lights' shadow maps (in game units): what is closer to a light than this casts no shadow from it
point light shadow near = 16

[Shaders]

# Keeps the linked shader programs on disk so the GPU driver does not compile them again on the next start.
# The cache is rebuilt by itself after a driver update or when the renderer changes.
program binary cache = true

[Post Processing]

# Enable Post Processing.
enabled = true

# Transparent depth postpass. Re-renders transparent objects with alpha-clipping forced with a fixed threshold.
transparent postpass = false

[GUI]

# Stretch menus, load screens, etc. to the window aspect ratio.
stretch menu background = true

# If this setting is true, dialogue topics will have a different color if the topic is specific to the NPC you're talking to or the topic was previously seen. Color can be changed in settings.cfg.
color topic enable = true

# Scales GUI window and widget size. (<1.0 is smaller, >1.0 is larger).
scaling factor = 2.0

[Groundcover]

# Enable some special settings for groundcover mods (rendering distance, density). Also enable animation and disable colision for groundcover meshes. Require to load groundcover mods via Groundcovers tab in mod manager.
enabled = true

[Water]

# Enable water shader.
shader = true

[Textures]

# Converts DXT (S3TC) textures when they are loaded, for GPUs that cannot sample S3TC (phones). Off by default.
# The converted textures are kept in a cache folder, so each texture is only converted once.
enable texture conversion = false

# astc: smaller and better quality, but the first conversion is slow. etc2: far faster to convert, larger, lower quality.
# Only one can be used at a time; the astc settings below do not apply to etc2.
texture conversion format = astc

# ASTC block size (4x4 is 8 bits per pixel, 6x6 3.6, 8x8 2, 12x12 0.9).
# Valid: 4x4 5x4 5x5 6x5 6x6 8x5 8x6 8x8 10x5 10x6 10x8 10x10 12x10 12x12
astc block size = 6x6

# Encoder effort from 0 (fastest) to 100 (best quality, very slow). 10 is "fast", 60 "medium", 98 "thorough".
astc quality = 10

# Textures larger than this (in pixels) are converted from a smaller mip level instead.
astc max size = 4096

# Threads used to convert one texture. 0 uses every core.
astc threads = 0

# Alpha3: load large textures small first (their smaller mip levels only, so cells are ready sooner and, with texture
# conversion, only those levels are converted while loading), then at full size once something drawn with them covers
# more pixels across on the screen than the small texture has, a few per frame. Far away they stay small. Helps with
# high resolution texture packs; vanilla textures are small already. Pictures shown flat on the screen are always read
# at full size: the GUI, splash screens and menu art (everything read on the main thread, outside textures/, or under
# textures/menu, levelup, scroll, compass, target and tx_menubook), and any texture once streaming has had to make it
# full size without seeing it drawn (remembered in the cache folder's texture-streaming-full.list).
streaming = true

# The largest side, in pixels, of what a texture starts at.
streaming start size = 64

# Textures made full size per frame (more: sharp sooner, fewer: smoother frame times while it happens).
streaming swaps per frame = 8

# Lets go of a texture file's pixels once they are on the GPU (the phone's GPU memory is the same RAM, so the engine
# otherwise holds every texture twice), reading the file again if a texture needs them later. With streaming, the full
# size image is read again when it is wanted instead of being kept in the meantime. Only textures/ DDS (or KTX) files.
release uploaded images = true

[General]

# What the engine takes its memory from (Android). system is the phone's allocator (Scudo): it gives large freed blocks
# back to Android at once, so with [Textures] release uploaded images the app uses about 400 MB less (Vivec, 2.48 GB
# against 2.89 GB; mimalloc kept most of what was let go, saving 113 MB). mimalloc has no per-size-class limit, which
# avoids "Scudo OOM: The process has exhausted 256M for size class N" with very big mod lists: switch to it if that shows.
allocator = system

# full (the default): never backs off, whatever the temperature.
# auto: while Android forecasts the phone will throttle (Android 11+), background texture conversion uses fewer cores and
# frames are held a little longer, so it does not reach the point where every core and the GPU are clamped at once.
thermal mode = full

[Experimental]

# The 3D scene drawn at this much of the resolution ([Video] resolution x and y, or the in-game setting) and upscaled
# onto the screen, sharpened; the GUI stays at the full resolution. 1 = off. 0.75 draws 56% of the pixels.
render scale = 1.0

# How it is upscaled: bilinear (cheapest, soft), lanczos (sharper, 16 taps), fsr (FSR 1 EASU: follows edges, 12 taps),
# auto (FSR 1 EASU, timed on the GPU over the first frames, and bilinear when it takes over 3 ms a frame: on a low end GPU
# at a high resolution EASU alone can cost more than drawing the scene)
render scale upscaler = auto

# How it is sharpened after: none, rcas (FSR 1's), cas (AMD contrast adaptive sharpening)
render scale sharpening = rcas

# How strongly (0 to 1)
render scale sharpness = 0.5

# Normal maps made from every texture's own colours (textures/foo_n.dds for foo.dds, where the data has none), cached in
# the cache directory's generatedmaps folder. Only .dds textures.
generated normal maps = false

# With the height in the map's alpha used for parallax (foo_nh.dds)
generated normal maps parallax = false

# How strong the generated relief is (0.2 to 3)
generated normal map strength = 1.0

# Specular maps made the same way: shine on metal and wet stone, none on cloth and earth (foo_spec.dds, and
# foo_diffusespec.dds for the terrain)
generated specular maps = false

# Which textures are which material, by keywords of their names: "material:keyword,keyword;..." in order, the first
# rule with a keyword in the name wins; "skip" gets no generated maps at all. Empty: the built-in rules. Materials:
# bark, wood, stone, masonry, plaster, dirt, grass, sand, metal.
material rules = 

# Bark, wood, stone, masonry, plaster, dirt, grass, sand and metal drawn by the shaders on the textures the material
# rules name. Makes the generated normal maps too (the material is stored in them), whatever their switch says.
procedural materials = false

# true: the texture's painted detail is not used, only its average colour; the material is drawn at every distance.
# false: the texture stays, and the material is added to it up close.
procedural replaces textures = true

# How much of the material is added (0 to 1; replacing: how deep its relief is)
procedural strength = 1.0

# Where the material has faded out when it is added to the texture (game units)
procedural distance = 3000

# Where a texture is magnified (a wall at arm's length), its own fine detail laid over it again, smaller
detail up close = false

detail strength = 1.0

# Where it has faded out (game units)
detail distance = 1500

# On steep slopes the terrain's texture is also projected from the sides, so cliffs are not smeared
terrain triplanar = false

# Where two terrain textures meet, the one that stands higher (stones over dirt) shows first, in a crisp edge
terrain height blending = false

# How crisp that edge is (1 = as without it, 4 = hard)
terrain height blend sharpness = 2.5

# Ambient occlusion from the depth, as a post-processing pass (shaders/a3_ambientocclusion.omwfx, in the chain)
ambient occlusion = false

# A filmic tone curve, more colour, warm lights and cool shadows, haze with distance, a soft vignette
# (shaders/a3_look.omwfx, at the end of the chain; its strengths are in the post-processing menu)
look = false

# Blades of grass growing out of the terrain where its grassy textures are painted, swaying in the wind and parting
# around the player
grass = false

# Blades per area (0.05 to 4; 1 is about one per 140 square units, in clumps)
grass density = 1.0

# Blade height (0.2 to 3; 1 is knee high)
grass height = 1.0

# How far it grows from the camera (game units, 500 to 8000)
grass distance = 2500

# How much it sways (0 to 3)
grass wind = 1.0

# No blades coming out through rocks, walls, roots and whatever else stands on the ground
grass clearance = true

# How hard it leans the way the storm blows in blizzards and ash and blight storms, in rolling gusts (0 to 3; 0: as in
# any other wind)
grass storm = 1.0

# Some clumps of tall seed stalks and of short broad blades, clumps in darker and lighter shades, a rare yellow
# bushel, and drier patches (the colours themselves come from each grassy ground texture: brown in the ashlands)
grass variety = true

# The ground sets its size: tall and dense where its texture is green, short and sparse on ash grey and brown, in
# meadow patches of taller and shorter
grass soil = true

# Other small things among the blades: rosettes of leaves lying flat (as clover), stiff dark sedge near the water,
# cushions of moss (pale lichen on ash, where they are most of what grows) and now and then tiny mushrooms. With
# grass soil, bare ash and soil (not roads) gets a little lichen, moss and short grass here and there
grass shapes = true

# Bugs among the grass: lines of ants and beetles (more on bare ash), grasshoppers hopping, bees and butterflies over
# green ground by day, dragonflies near the water, clouds of gnats, fireflies at night; the fliers keep out of the
# wind and rain. Only seen close by
grass bugs = true

# How many (0 to 4)
grass bug density = 1.0

# Cheap antialiasing: no blade drawn thinner than a pixel, and those widened to it fade into the ground's colour, so
# grass in the distance does not sparkle
grass antialiasing = true

# Trees, bushes and hanging moss moving in the wind: their leaves, branches and fronds (by the textures' names below)
# sway with the gusts and flutter, more in storms, and the trunks bend a little; rocks and people stay still
tree sway = false

# How far they move (0 to 4)
tree sway strength = 2.5

# What the moving textures' names contain, comma separated, "-" in front to keep a name out; empty: the defaults
# (leaves, leaf, branches, fern, needles, shrub, hackle, ivy, vine, kelp, willow_flower, moss, plant_, caveplant,
# -deadleaves, -stem)
tree sway textures = 

# How much the trunks bend with the leaves, from the ground up (0 to 2; 0 keeps them still)
tree trunk sway = 1.5

# What the trunks' textures' names contain, as above; empty: the defaults (bark, trunk, -telv_, -deadbark)
tree trunk textures = 
